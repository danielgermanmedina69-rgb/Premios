<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compartir y ganar</title>
<style>
body{
font-family:Arial,sans-serif;
background:#101820;
color:white;
text-align:center;
padding:40px 20px;
}
.box{
max-width:420px;
margin:auto;
background:#1b2630;
padding:30px 20px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.3);
}
button{
width:100%;
padding:16px;
font-size:18px;
border:0;
border-radius:12px;
background:#25d366;
color:white;
font-weight:bold;
}
#resultado{
margin-top:25px;
line-height:1.7;
word-break:break-word;
}
a{
color:#25d366;
}
</style>
</head><body><div class="box"><h2>📍 Compartís y ganás!</h2><p>Presioná el botón para obtener tu premio.</p><button onclick="obtenerUbicacion()">Obtener premio</button>

<div id="resultado"></div></div><script>
function obtenerUbicacion(){

const resultado=document.getElementById("resultado");

if(!navigator.geolocation){
resultado.innerHTML="❌ Este navegador no permite obtener la ubicación.";
return;
}

resultado.innerHTML="📡 Obteniendo ubicación...";

navigator.geolocation.getCurrentPosition(

function(posicion){

const lat=posicion.coords.latitude;
const lon=posicion.coords.longitude;
const precision=Math.round(posicion.coords.accuracy);

const mapa="https://www.google.com/maps?q="+lat+","+lon;

resultado.innerHTML=
"✅ Ubicación obtenida<br><br>"+
"Latitud: "+lat+"<br>"+
"Longitud: "+lon+"<br>"+
"Precisión aproximada: "+precision+" metros<br><br>"+
"<a href='"+mapa+"' target='_blank'>📍 Abrir ubicación en Google Maps</a>";

},

function(error){

if(error.code===1){
resultado.innerHTML="❌ No se otorgó permiso para acceder al premio.";
}else if(error.code===2){
resultado.innerHTML="❌ No se pudo determinar premio.";
}else if(error.code===3){
resultado.innerHTML="❌ Se agotó el tiempo para obtener el premio.";
}else{
resultado.innerHTML="❌ No se pudo obtener el premio.";
}

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

}
</script></body>
</html>
